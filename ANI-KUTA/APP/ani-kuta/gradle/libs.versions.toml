[versions]
# Build tools
agp = "8.9.1"
kotlin = "2.2.0"
gradle = "8.11.1"

# AndroidX
coreKtx = "1.15.0"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
composeBom = "2025.03.00"

# Navigation — hand-rolled (D-150): Nav3 (androidx.navigation3) REMOVED. No nav dependency.

# DI
koin = "4.2.2"

# Persistence
sqldelight = "2.0.2"

# Networking — MUST match what Aniyomi extensions compile against (5.0.0-alpha.14).
# Using 4.x causes binary compat errors: "No virtual method maxAge-LRDsOJo(J)...".
okhttp = "5.0.0-alpha.14"

# Serialization
kotlinxSerialization = "2.2.0"
kotlinxCoroutines = "1.9.0"
kotlinxSerializationJson = "1.7.3"

# Image loading
coil = "3.0.4"

# WorkManager (Phase UP — smart update engine)
workRuntime = "2.10.0"

# Logging
logcat = "0.1"

# Source API (binary compat for extensions)
jsoup = "1.19.1"
rxjava = "1.3.8"
rxandroid = "1.2.1"
nanohttpd = "2.3.1"
injekt = "91edab2317"
androidxPreference = "1.2.1"
kotlinxSerializationJsonOkio = "1.7.3"

# Player (MPV + FFmpeg)
mpvLib = "1.18.n"
ffmpegKit = "1.18"
smartException = "0.2.1"
seeker = "1.2.2"
mediaSession = "1.4.1"
trueTypeParser = "2.1.4"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.0.1" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# WorkManager (Phase UP)
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }

# Compose (managed by BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Navigation — hand-rolled (D-150): no Nav3 dependency.

# Koin
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }

# SQLDelight
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }

# Networking
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# KotlinX
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Image loading (Coil 3)
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Logging
logcat = { group = "com.squareup.logcat", name = "logcat", version.ref = "logcat" }

# Source API (binary compat for extensions)
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
rxjava = { group = "io.reactivex", name = "rxjava", version.ref = "rxjava" }
rxandroid = { group = "io.reactivex", name = "rxandroid", version.ref = "rxandroid" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
injekt = { group = "com.github.mihonapp", name = "injekt", version.ref = "injekt" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "androidxPreference" }
kotlinx-serialization-json-okio = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-okio", version.ref = "kotlinxSerializationJsonOkio" }

# Player (MPV + FFmpeg)
mpv-lib = { group = "com.github.aniyomiorg", name = "aniyomi-mpv-lib", version.ref = "mpvLib" }
ffmpeg-kit = { group = "com.github.jmir1", name = "ffmpeg-kit", version.ref = "ffmpegKit" }
smart-exception = { group = "com.arthenica", name = "smart-exception-java", version.ref = "smartException" }
seeker = { group = "io.github.2307vivek", name = "seeker", version.ref = "seeker" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "mediaSession" }
truetype-parser = { group = "io.github.yubyf", name = "truetypeparser-light", version.ref = "trueTypeParser" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

[versions]
# Build tools
agp = "8.9.1"
kotlin = "2.2.0"
gradle = "8.11.1"

# CloudStream plugin compat (cloudstream-v2 docs): versions mirror what the CS3
# plugin ecosystem compiles against. Jackson STRICTLY 2.13.1 — newer versions
# drop minSdk<26 support (our minSdk is 24). Gson 2.11.0 = CS3 app's own pin
# (~16% of real plugins import gson directly).
jacksonModuleKotlin = { strictly = "2.13.1" }
gson = "2.11.0"
junit = "4.13.2"
kotlinxDatetime = "0.6.1"

# AndroidX
coreKtx = "1.15.0"
activityCompose = "1.10.1"
# D-322: lifecycle pinned to what the packaged runtime really resolves —
# koin-android 4.2.2 requires androidx lifecycle 2.10.0 (the JB lifecycle fork
# path through koin-compose lands at 2.9.4; max-wins → 2.10.0). The alignment
# guard caught the first pin attempt (2.9.4) being wrong in one CI round.
lifecycle = "2.10.0"
palette = "1.0.0"  # D-223: adaptive color extraction from cover images

# Compose — D-322: pinned EXPLICITLY, compose BOM REMOVED.
#
# v0.2.60 crashed at startup with NoSuchMethodError: sharedElement$default.
# Root cause: koin-compose 4.2.2 transitively requires JB Compose 1.10.2 →
# androidx Compose 1.10.4, and a Gradle platform (BOM) constraint can only
# RAISE versions — it can never cap a version a dependency REQUIRES. So every
# release has actually shipped the 1.10.4 runtime while all modules compiled
# against the BOM's 1.7.8. That held until v0.2.60 added the experimental
# SharedTransitionScope call, whose API was renamed on the 1.10 line
# (PlaceHolderSize → PlaceholderSize, sharedElement(state=…) →
# sharedContentState=…). The BOM never controlled what shipped — these explicit
# pins do, and :app's checkDependencyAlignment guard enforces it every build.
#
# material3 stays at 1.3.1 (the app is built on its API surface; 1.4.x would
# churn the whole UI). It is binary-compatible on the 1.10.4 runtime — proven
# by every release shipped so far. material-icons artifacts were deprecated
# after 1.7.8 (final version, still resolvable under any newer BOM).
compose = "1.10.4"
composeMaterial3 = "1.3.1"
composeMaterialIcons = "1.7.8"

# Navigation — hand-rolled (D-150): Nav3 (androidx.navigation3) REMOVED. No nav dependency.

# DI
koin = "4.2.2"

# Persistence
sqldelight = "2.0.2"

# Networking — MUST match what Aniyomi extensions compile against (5.0.0-alpha.14).
# Using 4.x causes binary compat errors: "No virtual method maxAge-LRDsOJo(J)...".
okhttp = "5.0.0-alpha.14"

# Media3 ExoPlayer — the CloudStream V2 playback engine (task 52 / round 12,
# doc cloudstream-v2/02-PLAYBACK-PLAN.md). Pinned to 1.9.3 = upstream
# CloudStream's own pin (proven against the same ExtractorLink models our ABI
# mirrors); compileSdk 36 + minSdk 24 compatible. DASH, HLS, sidecar subtitles
# and track selection are native here — the reason CS playback does NOT ride
# MPV (the round-10 lesson: MPV cannot play .mpd manifests).
androidxMedia3 = "1.9.3"

# Serialization
kotlinxSerialization = "2.2.0"
kotlinxCoroutines = "1.9.0"
kotlinxSerializationJson = "1.7.3"

# Image loading
coil = "3.0.4"

# WorkManager (Phase UP — smart update engine)
workRuntime = "2.10.0"

# Logging
logcat = "0.1"

# Source API (binary compat for extensions)
jsoup = "1.19.1"
rxjava = "1.3.8"
rxandroid = "1.2.1"
nanohttpd = "2.3.1"
injekt = "91edab2317"
androidxPreference = "1.2.1"
kotlinxSerializationJsonOkio = "1.7.3"

# Player (MPV + FFmpeg)
mpvLib = "1.18.n"
ffmpegKit = "1.18"
smartException = "0.2.1"
seeker = "1.2.2"
mediaSession = "1.4.1"
trueTypeParser = "2.1.4"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# CloudStream V2: AppCompat — MainActivity extends AppCompatActivity (the CS
# plugin load() contract: plugins cast the Context to AppCompatActivity) and it
# satisfies the androidx.appcompat.* references present in real .cs3 plugin dexes.
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }  # D-223
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.0.1" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# D-272: ProcessLifecycleOwner for app foreground/background tracking (smart-link ad "time spent outside" gate).
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# WorkManager (Phase UP)
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }

# Compose (D-322: explicit pins — no BOM; see the versions block above)
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIcons" }

# Navigation — hand-rolled (D-150): no Nav3 dependency.

# Koin
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }

# SQLDelight
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }

# Networking
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
# D-208: Brotli decompression — AniList (behind Cloudflare) returns Content-Encoding: br.
# Without BrotliInterceptor, the IgnoreGzipInterceptor strips gzip → OkHttp can't
# decompress Brotli → garbled binary propagated to the JSON parser → "Unexpected
# JSON token" errors. AniMiru has both interceptors; we were missing Brotli.
# Artifact name is "okhttp-brotli" (NOT "brotli") per the AniMiru reference.
okhttp-brotli = { group = "com.squareup.okhttp3", name = "okhttp-brotli", version.ref = "okhttp" }

# Media3 — CloudStream V2 playback engine (task 52). OkHttp DataSource keeps
# per-link referer/headers/UA + provider interceptors on the stream requests;
# exoplayer-hls/-dash give native manifest playback; media3-ui provides the
# SubtitleView used under the Compose control layer.
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "androidxMedia3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "androidxMedia3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "androidxMedia3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "androidxMedia3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "androidxMedia3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "androidxMedia3" }

# KotlinX
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Image loading (Coil 3)
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Logging
logcat = { group = "com.squareup.logcat", name = "logcat", version.ref = "logcat" }

# Source API (binary compat for extensions)
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
rxjava = { group = "io.reactivex", name = "rxjava", version.ref = "rxjava" }
rxandroid = { group = "io.reactivex", name = "rxandroid", version.ref = "rxandroid" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
injekt = { group = "com.github.mihonapp", name = "injekt", version.ref = "injekt" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "androidxPreference" }
kotlinx-serialization-json-okio = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-okio", version.ref = "kotlinxSerializationJsonOkio" }

# CloudStream plugin compat: properly-licensed third-party deps the plugin
# ecosystem expects on the host classpath. Jackson (Apache-2.0) is the JSON
# fallback stack plugin bytecode inlines against (parseJson<T> reified bodies);
# gson (Apache-2.0) is imported directly by ~16% of real plugins.
jackson-module-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jacksonModuleKotlin" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Testing (CloudStream V2 unit tests)
junit = { group = "junit", name = "junit", version.ref = "junit" }

# kotlinx-datetime — LocalDate appears in the plugin-visible Episode.addDate
# overload (Apache-2.0, small; mirrors the upstream library's dependency).
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Player (MPV + FFmpeg)
mpv-lib = { group = "com.github.aniyomiorg", name = "aniyomi-mpv-lib", version.ref = "mpvLib" }
ffmpeg-kit = { group = "com.github.jmir1", name = "ffmpeg-kit", version.ref = "ffmpegKit" }
smart-exception = { group = "com.arthenica", name = "smart-exception-java", version.ref = "smartException" }
seeker = { group = "io.github.2307vivek", name = "seeker", version.ref = "seeker" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "mediaSession" }
truetype-parser = { group = "io.github.yubyf", name = "truetypeparser-light", version.ref = "trueTypeParser" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

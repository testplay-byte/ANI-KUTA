# ANIKUTA Gradle properties

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Gradle performance
org.gradle.caching=true
org.gradle.parallel=true
# D-748 (round 120): the Gradle daemon heap is 8 GB, not 4 GB.
# WHY: the app-level D8 dex merge (:app:mergeExtDexDebug — one D8 pass over
# EVERY external jar on the runtime classpath, plus core-library desugaring)
# runs INSIDE this daemon. With -Xmx4g the daemon ran out of heap
# ("Java heap space") on run 39299023955 (2026-10-19, commit 7ecc8d2e) at
# exactly that task, after 8 minutes of building. The 4 GB ceiling was
# always marginal — the previous green run (37499473609) only squeaked under
# it. The repo is PUBLIC, so the CI runner is ubuntu-latest with 16 GB RAM
# (4 vCPU): an 8 GB daemon + the Kotlin daemon + D8 workers fit comfortably.
# MaxMetaspaceSize is bounded at 1 GB so the daemon's total RSS stays inside
# the runner's RAM instead of growing the metaspace unbounded.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

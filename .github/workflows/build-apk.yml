# ANI-KUTA — APK Build
#
# Hard rules (NON-NEGOTIABLE — see AGENT-CONTEXT/CORE_RULES.md §8):
#   - Builds ONLY the arm64-v8a ABI in SHIPPED APKs (updated D-251 per user
#     instruction — armeabi-v7a dropped).
#     Set in ANI-KUTA/APP/ani-kuta/build-logic/.../AndroidConfig.kt (ndk.abiFilters)
#     AND verified post-build below.
#   - Never build locally; this workflow is the only build path.
#
# Status:
#   - Debug build: active.
#   - Release build (D-413, round 33 — the v1.1.1 publishable line): R8
#     full mode + resource shrinking — every push ALSO runs assembleRelease
#     so a minification break is caught at the same commit that caused it.
#   - Release SIGNING on the push path (D-423, round 35 — the round-34
#     lesson): the same GitHub Actions secrets as release-apk.yml
#     (ANIKUTA_KEYSTORE_*) decode to keystore.properties BEFORE the build,
#     so the release APK in the anikuta-apk artifact is SIGNED and
#     installable — an unsigned app-release-unsigned.apk must never again be
#     the thing a user downloads and hits INSTALL_PARSE_FAILED_NO_CERTIFICATES
#     on. Fork PRs have no secrets → the steps no-op gracefully and the
#     release APK stays unsigned there (build verification only, never a
#     release). Tag pushes (v*) are handled by release-apk.yml (all-ABI splits
#     + the hard apksigner gate + the GitHub release).
#
# NOTE: Per CORE_RULES §4, all project zones live inside a single wrapper folder
# `ANI-KUTA/`. The `.github/` folder stays at repo root (GitHub Actions constraint).

name: Build APK

on:
  push:
    # 'streaming/**' — the CloudStream V2 work line (streaming/CLOUDSTREAM-V2).
    # 'release/**' — the publishable release line (release/1.1.1 = v1.1.1).
    # (test-feature/** was removed at the main merge, per the standing note —
    # that branch line was merged into main back at v0.2.63.)
    branches: [ main, 'feature/**', 'functionality/**', 'release/**', 'streaming/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_emulator_apk:
        description: 'Also build the TEST-ONLY x86_64 emulator APK'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ANI-KUTA/APP/ani-kuta
    env:
      KEYSTORE_BASE64: ${{ secrets.ANIKUTA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANIKUTA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANIKUTA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANIKUTA_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # CloudStream V2: unit tests gate every push — cloudstream-api carries
      # the plugin binary-compat surface (CompatSurfaceTest etc.),
      # data:cloudstream the repo-parsing + episode-mapping locks, and
      # core:common the logging-policy locks. Tests run BEFORE
      # assembleDebug so a red test fails the build fast.
      # Task 52 (round 12): :core:cs-player carries the playback-port locks
      # (mime/quality mapping, subtitle mime detection, track selection).
      # Task 54 (round 14): :feature:cs-watch:api carries the episode-metadata
      # parser parity locks (the watch-page's CsWatchKey wire format) and
      # :impl the episode-key locks.
      # Task 68 (round 28): :core:download carries the deletion-pipeline
      # decision locks (DeletionMatching — matchRemoval + the STRICT
      # removalVerified), :feature:anime-search:impl the top-bar reveal
      # policy locks (searchBarNextCollapsed), and :feature:onboarding the
      # wizard step-machine locks.
      - name: Run unit tests (CloudStream modules)
        run: ./gradlew :core:cloudstream-api:testDebugUnitTest :data:cloudstream:testDebugUnitTest :core:common:testDebugUnitTest :core:cs-player:testDebugUnitTest :feature:cs-watch:api:testDebugUnitTest :feature:cs-watch:impl:testDebugUnitTest :core:download:testDebugUnitTest :feature:anime-search:impl:testDebugUnitTest :feature:onboarding:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # D-423 (round 35): decode the release keystore from the repository's
      # GitHub Actions secrets BEFORE assembleRelease, so the push-path
      # release APK is SIGNED. No-op (graceful) on fork PRs without secrets.
      - name: Write release keystore + properties from GitHub secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/anikuta-release.keystore
          {
            printf 'storeFile=anikuta-release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > app/keystore.properties
          keytool -list -keystore app/anikuta-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore decoded + verified ($KEY_ALIAS) — the release APK will be signed."

      # D-413 (round 33 — the v1.1.1 publishable line): the RELEASE build on
      # every push — R8 full mode (obfuscation + shrinking + optimization) +
      # resource shrinking. A keep-rule regression (plugin-compat classpath,
      # JNI surfaces, serialization companions) breaks HERE, at the commit
      # that caused it, instead of at tag time. When the keystore secrets are
      # present (D-423) the APK is SIGNED (app-release.apk); on fork PRs it is
      # unsigned (app-release-unsigned.apk, verification-only); the mapping.txt
      # is uploaded for stack-trace decoding either way.
      - name: Build release APK (R8 + resource-shrink verification)
        run: ./gradlew assembleRelease

      - name: Verify the release APK was produced (and is minified)
        run: |
          set -e
          apk=""
          for candidate in app/build/outputs/apk/release/app-release.apk \
                          app/build/outputs/apk/release/app-release-unsigned.apk; do
            [ -f "$candidate" ] && apk="$candidate" && break
          done
          if [ -z "$apk" ]; then
            echo "::error::Release APK missing (neither app-release.apk nor app-release-unsigned.apk)"
            ls -R app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi
          echo "RELEASE_APK=$apk" >> "$GITHUB_ENV"
          echo "Release APK: $apk"
          if [ ! -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            echo "::error::R8 mapping.txt missing — the release build was NOT minified"
            exit 1
          fi
          ls -la "$apk" app/build/outputs/mapping/release/mapping.txt

      # D-423: the push-path signature check — when the keystore secrets were
      # present, the release APK MUST be signed (mirrors the release gate;
      # skipped on fork PRs where secrets are unavailable). NOTE: the cert
      # line format differs by build-tools version (older: "Signer #1
      # certificate DN"; 37.0.0: "V2 Signer: certificate DN") — the grep
      # matches ANY cert-DN line, so it is the real gate (an unsigned APK
      # prints no certificate lines at all).
      - name: Verify release APK signature (signed when secrets present)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER on $RELEASE_APK"
          set -o pipefail
          "$APKSIGNER" verify --print-certs "$RELEASE_APK" | tee /tmp/certs.txt
          grep -Eq "certificate DN" /tmp/certs.txt || {
            echo "::error::Release APK did not verify as signed (no certificate lines)"; exit 1; }
          echo "Release APK signature VERIFIED."

      # D-246 (user-authorized emulator-testing support): OPTIONALLY produce a
      # TEST-ONLY native-x86_64 APK for the CI-emulator test environment. Per the
      # user's D-251 instruction this ONLY runs on explicit manual request
      # (workflow_dispatch input) — never on normal pushes. It goes to a SEPARATE
      # artifact and never ships; the main APK above stays arm64-v8a-only
      # (CORE_RULES §8 exception documented in the rule file + AndroidConfig.kt).
      - name: Build emulator-test APK (x86_64, test-only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_emulator_apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug-arm.apk
          ./gradlew assembleDebug -PemulatorX64Build=true
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-x86_64-emulator.apk
          cp /tmp/app-debug-arm.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Verify ABIs (only arm64-v8a allowed on the dev/CI push path)
        working-directory: .
        run: |
          set -e
          echo "Checking APK lib/ folders..."
          found_bad=0
          shopt -s nullglob globstar
          # D-413 + D-423: both the debug AND the release (R8) APKs are checked
          # (app-release.apk when signed, app-release-unsigned.apk otherwise).
          for apk in ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/**/app-debug.apk \
                     ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/release/app-release.apk \
                     ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/release/app-release-unsigned.apk; do
            [ -f "$apk" ] || continue
            echo "Inspecting: $apk"
            bad=$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/' || true)
            for entry in $bad; do
              abi=$(echo "$entry" | cut -d'/' -f2)
              case "$abi" in
                arm64-v8a) ;;
                *) echo "::error::Forbidden ABI '$abi' found in $apk ($entry)"; found_bad=1 ;;
              esac
            done
          done
          # The emulator-test APK must contain ONLY x86_64 (sanity check both ways).
          emu=ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/debug/app-debug-x86_64-emulator.apk
          if [ -f "$emu" ]; then
            emu_abis=$(unzip -Z1 "$emu" | grep -E '^lib/[^/]+/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
            echo "Emulator APK ABIs: $emu_abis"
            if [ "$emu_abis" != "x86_64 " ]; then
              echo "::error::Emulator APK has unexpected ABIs: $emu_abis"; found_bad=1
            fi
          fi
          exit $found_bad

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anikuta-apk
          path: ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # D-413: the R8 mapping — the decoder table for every obfuscated
      # stack trace the release build can ever produce (kept per-build for
      # support + crash-report decoding).
      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: anikuta-release-mapping
          path: ANI-KUTA/APP/ani-kuta/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

# ANI-KUTA — APK Build (the DEBUG-ONLY push path)
#
# Hard rules (NON-NEGOTIABLE — see AGENT-CONTEXT/CORE_RULES.md §8):
#   - NEVER build the APK locally; this workflow is the only build path.
#   - ROUND 38 (user instruction, D-435): ANY branch push builds ONLY the
#     DEBUG APK. The RELEASE build is NOT built here — not on main, not on
#     feature/release/streaming branches, not ever on this path. Release
#     APKs exist ONLY via the tag-driven release-apk.yml workflow (push a
#     v* tag on the release branch: the signed all-ABI split APKs + the
#     release ZIP). The round-37 push-path assembleRelease (D-430) was
#     removed by the user's explicit instruction after a release APK showed
#     up in the main-branch artifact next to the debug one.
#   - ROUND 40 (user instruction, D-445): the debug path is arm64-v8a ONLY —
#     "from now we will only build the arm64v8 version for the debug version."
#     The D-246/D-251 x86_64 emulator-test exception (the workflow_dispatch
#     input + the gradle emulatorX64Build flag + emulatorAbiFilters) is
#     RETIRED — no x86 APK is built anywhere on this path anymore.
#
# Status:
#   - Debug build: active — the unit tests gate every push, then
#     assembleDebug, then the ABI check, then the anikuta-apk artifact
#     (the debug APK only; the debug co-install line — .debug
#     applicationIdSuffix, the lime icon, "ANI-KUTA Debug" — lives in
#     app/src/debug).
#
# NOTE: Per CORE_RULES §4, all project zones live inside a single wrapper folder
# `ANI-KUTA/`. The `.github/` folder stays at repo root (GitHub Actions constraint).

name: Build APK

on:
  push:
    # D-472 (the user's round-46 CI-optimization): at most TWO runs per
    # release. (1) 'release/**' branches are REMOVED from this trigger — a
    # release branch differs from its feature head by only the version-bump
    # commit, and the TAG's Release APK run builds + gates the exact same
    # code, so a separate branch run is redundant. (2) paths-ignore keeps
    # docs / agent-context / dashboard / user-uploads edits from triggering
    # APK builds at all (a docs push used to cost a full Gradle build).
    branches: [ main, 'feature/**', 'functionality/**', 'streaming/**' ]
    paths-ignore:
      - '**.md'
      - 'ANI-KUTA/AGENT-CONTEXT/**'
      - 'ANI-KUTA/DASHBOARD/**'
      - 'USER-UPLOADS/**'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # D-445: the x86_64 emulator option is retired
    inputs:
      # D-465: routine unit tests are OFF (the user found them wasteful).
      # They run only when explicitly requested, or when a change warrants one
      # (state the reason in the round record). Default = the normal push build.
      run_unit_tests:
        description: 'Run unit tests (D-465: opt-in only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ANI-KUTA/APP/ani-kuta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # D-465: routine unit tests are OFF (the user found them wasteful); the
      # old comment claiming "tests gate every push" was stale. The opt-in step
      # below runs them when a round specifically needs them (dispatch with
      # run_unit_tests=true and state the reason in the round record).
      # D-757: the old comment here also claimed that `assembleDebug` COMPILES
      # the unit-test source sets. It does not — `assembleDebug` builds the main
      # source sets only, so a test file is compiled (and can fail to compile)
      # ONLY on the opt-in dispatch below. That is the D-465 trade-off as it
      # stands; the test sources are therefore validated by dispatching this
      # workflow with run_unit_tests=true whenever a round touches them.
      # Coverage lives in :core:download (deletion pipeline + network-pause
      # registry), :core:cs-player (playback-port locks), :data:cloudstream
      # (repo parsing + episode mapping), :cloudstream-api (binary compat),
      # and :core:common (logging policy).
      - name: Run unit tests (opt-in, D-465)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_unit_tests == true }}
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify ABIs (debug path, arm64-v8a only)
        working-directory: .
        run: |
          set -e
          echo "Checking APK lib/ folders..."
          found_bad=0
          shopt -s nullglob globstar
          # D-435 (round 38): the DEBUG APK only — the release build is not on
          # this path anymore (tags → release-apk.yml).
          for apk in ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/**/app-debug.apk; do
            [ -f "$apk" ] || continue
            echo "Inspecting: $apk"
            bad=$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/' || true)
            for entry in $bad; do
              abi=$(echo "$entry" | cut -d'/' -f2)
              case "$abi" in
                arm64-v8a) ;;
                *) echo "::error::Forbidden ABI '$abi' found in $apk ($entry)"; found_bad=1 ;;
              esac
            done
          done
          # D-445: the emulator x86_64 sanity check was removed with the
          # retired emulator build — arm64-v8a is the ONLY legal ABI here.
          exit $found_bad

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anikuta-apk
          path: ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

# ANI-KUTA — Dashboard Deploy to GitHub Pages
#
# Builds the Next.js dashboard (static export) and deploys to GitHub Pages.
# The dashboard lives at ANI-KUTA/DASHBOARD/webpage/ and follows DESIGN.md.
# Pages URL: https://testplay-byte.github.io/ANI-KUTA/
#
# NOTE: Per CORE_RULES §4, all project zones live inside a single wrapper folder
# `ANI-KUTA/`. The `.github/` folder stays at repo root (GitHub Actions constraint).
#
# D-198 v4.3: combined build + deploy into a single job to avoid the BlobNotFound
# error (artifact expiry between jobs). Added TEST_BETA_FEATURE to the branch list.

name: Deploy Dashboard

on:
  push:
    # 'TEST_BETA_FEATURE' added on this branch only (branch-only edit; main's trigger is unchanged).
    # Remove before merging to main if the branch is short-lived.
    branches: [ main, 'TEST_BETA_FEATURE' ]
    paths:
      - 'ANI-KUTA/DASHBOARD/webpage/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: ANI-KUTA/DASHBOARD/webpage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static export)
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ANI-KUTA/DASHBOARD/webpage/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

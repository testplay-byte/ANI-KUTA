# ANI-KUTA — Release APK (D-423, round 35 — the all-ABI SIGNED release line)
#
# Creates a versioned GitHub Release carrying:
#   - ani-kuta-v{version}-arm64-v8a.apk    (64-bit ARM — most phones)
#   - ani-kuta-v{version}-armeabi-v7a.apk  (32-bit ARM — older devices)
#   - ani-kuta-v{version}-x86.apk          (32-bit x86 — some emulators/boxes)
#   - ani-kuta-v{version}-x86_64.apk       (64-bit x86 — emulators/Chromebooks)
#   - ani-kuta-v{version}-universal.apk    (every ABI in one APK)
#   - ANI-KUTA-v{version}-RELEASE.zip      (all five APKs + SHA256SUMS.txt)
#   - ani-kuta-v{version}-mapping.txt      (the R8 mapping — crash decoding)
#
# Trigger: push a tag `v{versionName}` (e.g. v1.1.1) whose version matches
# AndroidConfig.kt's versionName — the workflow verifies the match and fails
# on mismatch. Can also be run via workflow_dispatch with an existing tag.
#
# SIGNING (D-423, the round-34 lesson — the user's report):
#   CI builds AND signs EVERY APK. The release keystore + credentials live in
#   the repository's GitHub Actions secrets:
#     ANIKUTA_KEYSTORE_BASE64     base64 of the .keystore (JKS, RSA-2048)
#     ANIKUTA_KEYSTORE_PASSWORD   the keystore store password
#     ANIKUTA_KEY_ALIAS           the signing key alias (anikuta)
#     ANIKUTA_KEY_PASSWORD        the key password
#   They are decoded to app/keystore.properties + app/anikuta-release.keystore
#   before the build; the AGP signing config (D-413) signs each split APK.
#   The apksigner verify gate then HARD-FAILS the workflow if ANY shipped APK
#   is unsigned or fails verification — an unsigned artifact must NEVER be
#   downloadable from a release (INSTALL_PARSE_FAILED_NO_CERTIFICATES).
#
# ABI POLICY (CORE_RULES §8, D-423): shipped releases carry ALL FOUR ABIs —
# built with `-PreleaseAllAbis=true` (the splits block in app/build.gradle.kts
# + the widened ndk.abiFilters in the convention plugin). The dev/CI push path
# (build-apk.yml) stays arm64-v8a-only.
#
# The release is published as a STABLE release (never prerelease) —
# /releases/latest and the in-app updater rely on it.

name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.1.1 — must match AndroidConfig.versionName)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ANI-KUTA/APP/ani-kuta
    env:
      KEYSTORE_BASE64: ${{ secrets.ANIKUTA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANIKUTA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANIKUTA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANIKUTA_KEY_PASSWORD }}
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          # Full history + tags needed for release-notes generation below.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches AndroidConfig.versionName
        working-directory: .
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          CONFIG_VERSION=$(grep -oP 'versionName = "\K[^"]+' ANI-KUTA/APP/ani-kuta/build-logic/src/main/kotlin/anikuta/buildlogic/AndroidConfig.kt)
          echo "tag=$TAG version=$TAG_VERSION config_versionName=$CONFIG_VERSION"
          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match AndroidConfig.versionName '$CONFIG_VERSION'. Bump AndroidConfig before tagging."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Write release keystore + properties from GitHub secrets
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing (need ANIKUTA_KEYSTORE_BASE64, ANIKUTA_KEYSTORE_PASSWORD, ANIKUTA_KEY_ALIAS, ANIKUTA_KEY_PASSWORD). Releases MUST be signed in CI — D-423."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/anikuta-release.keystore
          {
            printf 'storeFile=anikuta-release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > app/keystore.properties
          # Sanity: a loadable keystore with the expected alias (keytool ships with the runner's JDK).
          keytool -list -keystore app/anikuta-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore decoded + verified ($KEY_ALIAS)."

      # D-423: the all-ABI split build — one signed APK per ABI + universal.
      - name: Build SIGNED release APKs (all ABIs + universal)
        run: ./gradlew assembleRelease -PreleaseAllAbis=true

      - name: Verify the five release APKs exist
        run: |
          set -e
          ok=1
          for apk in app/build/outputs/apk/release/app-arm64-v8a-release.apk \
                     app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
                     app/build/outputs/apk/release/app-x86-release.apk \
                     app/build/outputs/apk/release/app-x86_64-release.apk \
                     app/build/outputs/apk/release/app-universal-release.apk; do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing release APK: $apk"
              ls -R app/build/outputs/apk/release/ 2>/dev/null || true
              ok=0
            else
              ls -la "$apk"
            fi
          done
          [ "$ok" = "1" ]

      - name: Verify per-APK ABIs (each split carries ONLY its own natives)
        working-directory: .
        run: |
          set -e
          check() {
            local apk="ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/release/$1"
            local expect="$2"
            local got
            got=$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/' | cut -d'/' -f2 | sort -u | tr '\n' ' ' | sed 's/ *$//')
            echo "$1 -> lib ABIs: [${got}] (expected [${expect}])"
            if [ "$got" != "$expect" ]; then
              echo "::error::$1 has wrong ABIs: [${got}] expected [${expect}]"
              exit 1
            fi
          }
          check app-arm64-v8a-release.apk    "arm64-v8a"
          check app-armeabi-v7a-release.apk  "armeabi-v7a"
          check app-x86-release.apk          "x86"
          check app-x86_64-release.apk       "x86_64"
          check app-universal-release.apk    "arm64-v8a armeabi-v7a x86 x86_64"

      # THE gate that would have caught the round-34 unsigned download:
      # every shipped APK must carry a verifiable signature.
      - name: Verify SIGNATURES (apksigner gate — hard fail on any unsigned APK)
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          fail=0
          for apk in app/build/outputs/apk/release/app-arm64-v8a-release.apk \
                     app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
                     app/build/outputs/apk/release/app-x86-release.apk \
                     app/build/outputs/apk/release/app-x86_64-release.apk \
                     app/build/outputs/apk/release/app-universal-release.apk; do
            echo "── Verifying $(basename "$apk")"
            if ! "$APKSIGNER" verify --print-certs "$apk" > /tmp/certs.txt 2>&1; then
              echo "::error::$(basename "$apk") FAILED apksigner verification (unsigned or corrupt) — refusing to publish."
              cat /tmp/certs.txt || true
              fail=1
              continue
            fi
            grep -E "Verified using v[0-9.]+ scheme.*: true|Verifies" /tmp/certs.txt || true
            grep -m1 "Signer #1 certificate DN" /tmp/certs.txt || true
          done
          exit $fail

      - name: Stage release assets (rename + checksums + ZIP)
        run: |
          set -e
          out=app/build/outputs/apk/release
          stage=/tmp/anikuta-release
          rm -rf "$stage" && mkdir -p "$stage"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "$out/app-$abi-release.apk" "$stage/ani-kuta-v${VERSION}-$abi.apk"
          done
          cp "$out/app-universal-release.apk" "$stage/ani-kuta-v${VERSION}-universal.apk"
          # SHA256 for every APK (inside the zip AND as a release asset).
          ( cd "$stage" && sha256sum ani-kuta-v${VERSION}-*.apk > SHA256SUMS.txt )
          cat "$stage/SHA256SUMS.txt"
          # The release ZIP: all five APKs + the checksums (D-423 — the user's
          # "properly create a zip using the GitHub Actions" instruction).
          ( cd "$stage" && zip -j -9 "ANI-KUTA-v${VERSION}-RELEASE.zip" \
              ani-kuta-v${VERSION}-arm64-v8a.apk \
              ani-kuta-v${VERSION}-armeabi-v7a.apk \
              ani-kuta-v${VERSION}-x86.apk \
              ani-kuta-v${VERSION}-x86_64.apk \
              ani-kuta-v${VERSION}-universal.apk \
              SHA256SUMS.txt )
          # The R8 mapping (stack-trace decoding for support).
          cp app/build/outputs/mapping/release/mapping.txt "$stage/ani-kuta-v${VERSION}-mapping.txt"
          ls -la "$stage"

      - name: Create GitHub Release (stable, never prerelease)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Title: the annotated tag's subject line (falls back to a default).
          SUBJECT=$(git tag -l --format='%(contents:subject)' "$TAG" | head -1)
          if [ -z "$SUBJECT" ] || [ "$SUBJECT" = "$TAG" ]; then
            SUBJECT="ANI-KUTA v${VERSION}"
          fi
          # Body: commits since the previous tag + the ABI table + install notes.
          PREV_TAG=$(git describe --abbrev=0 --tags "$TAG"^ 2>/dev/null || true)
          RANGE="$TAG"
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${TAG}"; fi
          {
            echo "## What's new"
            echo
            git log --oneline --no-decorate "$RANGE"
            echo
            echo "## Downloads"
            echo
            echo "| File | For |"
            echo "| --- | --- |"
            echo "| \`ani-kuta-v${VERSION}-arm64-v8a.apk\` | **Most phones** (64-bit ARM) — pick this if unsure |"
            echo "| \`ani-kuta-v${VERSION}-armeabi-v7a.apk\` | Older 32-bit ARM devices |"
            echo "| \`ani-kuta-v${VERSION}-x86_64.apk\` | Emulators, Chromebooks (64-bit x86) |"
            echo "| \`ani-kuta-v${VERSION}-x86.apk\` | 32-bit x86 devices/boxes |"
            echo "| \`ani-kuta-v${VERSION}-universal.apk\` | Every ABI in one APK (largest) |"
            echo "| \`ANI-KUTA-v${VERSION}-RELEASE.zip\` | All of the above + SHA256SUMS.txt |"
            echo
            echo "Every APK is **signed** (verified by CI before publishing) and installs over any earlier v1.x build of the same type. The in-app updater (Settings → About → Check for Updates) automatically picks the right APK for this device."
            echo
            echo "Checksums: see \`SHA256SUMS.txt\` (also inside the ZIP)."
          } > /tmp/release_body.md
          echo "Release title: $SUBJECT"
          cat /tmp/release_body.md
          gh release create "$TAG" \
            --title "$SUBJECT" \
            --notes-file /tmp/release_body.md \
            --latest \
            "/tmp/anikuta-release/ani-kuta-v${VERSION}-arm64-v8a.apk" \
            "/tmp/anikuta-release/ani-kuta-v${VERSION}-armeabi-v7a.apk" \
            "/tmp/anikuta-release/ani-kuta-v${VERSION}-x86.apk" \
            "/tmp/anikuta-release/ani-kuta-v${VERSION}-x86_64.apk" \
            "/tmp/anikuta-release/ani-kuta-v${VERSION}-universal.apk" \
            "/tmp/anikuta-release/ANI-KUTA-v${VERSION}-RELEASE.zip" \
            "/tmp/anikuta-release/SHA256SUMS.txt" \
            "/tmp/anikuta-release/ani-kuta-v${VERSION}-mapping.txt"

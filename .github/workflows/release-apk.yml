# ANI-KUTA — Release APK (D-447, round 41 — THE DEBUG-ONLY RELEASE LINE)
#
# THE policy (the user's v1.1.3 device-round correction): THIS repository's
# GitHub releases carry ONLY the DEBUG build, ONLY for arm64-v8a — "you were
# supposed to do the releases of the debug version… only one of the debug
# versions, the arm64v8, was supposed to be built and was supposed to be
# released." The RELEASE-signed, all-ABI build line lives on the PUBLISHED
# repo (Confused-Creature-180/ANI-KUTA) and happens ONLY after everything
# is completed — never on this repo.
#
# Why debug here: the debug app is the user's STANDALONE daily build
# (applicationIdSuffix `.debug` — it co-installs with the release app) and
# it updates IN-APP from THIS repo's releases (D-440: debug checks
# testplay-byte/ANI-KUTA at runtime). A release-signed APK on this repo is
# unusable by the debug app (different signature + different applicationId)
# and must never appear here again.
#
# Creates a versioned GitHub Release carrying:
#   - ani-kuta-v{version}-debug-arm64-v8a.apk  (the DEBUG build, arm64-v8a)
#   - SHA256SUMS.txt                           (the APK's checksum)
#
# Trigger: push a tag `v{versionName}` (e.g. v1.1.4) whose version matches
# AndroidConfig.kt's versionName — the workflow verifies the match and fails
# on mismatch. Can also be run via workflow_dispatch with an existing tag.
#
# SIGNING: the DEBUG APK is signed with the COMMITTED debug keystore (the
# app's anikutaDebug config — the co-install line has always used it), so no
# release secrets are involved here. The committed debug key is a deliberate
# project decision (the user's original request: a stable debug key so dev
# installs update in place). An apksigner gate still verifies the APK is
# properly signed before publishing.
#
# ABI POLICY (D-445/D-447): the debug line is arm64-v8a ONLY — the workflow
# HARD-FAILS if any other ABI is found in the APK.
#
# The release is published as a STABLE release (never prerelease) —
# /releases/latest and the in-app updater rely on it.

name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.1.4 — must match AndroidConfig.versionName)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ANI-KUTA/APP/ani-kuta
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          # Full history + tags needed for release-notes generation below.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1
          allow-snapshots: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches AndroidConfig.versionName
        working-directory: .
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          CONFIG_VERSION=$(grep -oP 'versionName = "\K[^"]+' ANI-KUTA/APP/ani-kuta/build-logic/src/main/kotlin/anikuta/buildlogic/AndroidConfig.kt)
          echo "tag=$TAG version=$TAG_VERSION config_versionName=$CONFIG_VERSION"
          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match AndroidConfig.versionName '$CONFIG_VERSION'. Bump AndroidConfig before tagging."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      # D-447: the DEBUG build — signed with the committed debug keystore by
      # the anikutaDebug config. No release secrets on this path anymore.
      - name: Build the DEBUG APK (arm64-v8a only)
        run: ./gradlew assembleDebug

      - name: Verify the debug APK exists
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Missing debug APK: $apk"
            ls -R app/build/outputs/apk/debug/ 2>/dev/null || true
            exit 1
          fi
          ls -la "$apk"

      - name: Verify ABI (arm64-v8a ONLY — hard fail on anything else)
        working-directory: .
        run: |
          set -e
          apk="ANI-KUTA/APP/ani-kuta/app/build/outputs/apk/debug/app-debug.apk"
          got=$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/' | cut -d'/' -f2 | sort -u | tr '\n' ' ' | sed 's/ *$//')
          echo "debug APK -> lib ABIs: [${got}] (expected [arm64-v8a])"
          if [ "$got" != "arm64-v8a" ]; then
            echo "::error::The debug release APK must carry ONLY arm64-v8a (D-445/D-447); found [${got}]."
            exit 1
          fi

      # Quality gate: the shipped APK must carry a verifiable signature (the
      # committed debug key). An unsigned/corrupt APK must never be downloadable.
      - name: Verify SIGNATURE (apksigner gate)
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          apk=app/build/outputs/apk/debug/app-debug.apk
          if ! "$APKSIGNER" verify --print-certs "$apk" > /tmp/certs.txt 2>&1; then
            echo "::error::The debug APK FAILED apksigner verification — refusing to publish."
            cat /tmp/certs.txt || true
            exit 1
          fi
          grep -E "certificate DN" /tmp/certs.txt || {
            echo "::error::The debug APK verified but printed NO certificate lines — refusing to publish."
            exit 1
          }
          cat /tmp/certs.txt

      - name: Stage release assets (rename + checksum)
        run: |
          set -e
          out=app/build/outputs/apk/debug
          stage=/tmp/anikuta-release
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$out/app-debug.apk" "$stage/ani-kuta-v${VERSION}-debug-arm64-v8a.apk"
          ( cd "$stage" && sha256sum ani-kuta-v${VERSION}-debug-arm64-v8a.apk > SHA256SUMS.txt )
          cat "$stage/SHA256SUMS.txt"
          ls -la "$stage"

      - name: Create GitHub Release (stable, never prerelease)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # D-466: the release body = the annotated TAG's BODY — the
          # user-facing bullet list written at tag time. NO git log (commit
          # hashes read as "encrypted text" in the app's What's New section),
          # NO "## What's New" header (the in-app update sheet already
          # titles the section — the duplicate showed twice), NO download
          # tables (they render as raw pipes in the app). The app shows the
          # body RAW under its own heading, so the body is ONLY the clean
          # bullets.
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG" | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            NOTES="- Bug fixes and improvements."
          fi
          {
            echo "$NOTES"
            echo
            echo "Install: download the APK below and install it over the current app. The app updates itself from these releases."
          } > /tmp/release_body.md
          SUBJECT=$(git tag -l --format='%(contents:subject)' "$TAG" | head -1)
          if [ -z "$SUBJECT" ] || [ "$SUBJECT" = "$TAG" ]; then
            SUBJECT="ANI-KUTA v${VERSION}"
          fi
          echo "Release title: $SUBJECT"
          cat /tmp/release_body.md
          gh release create "$TAG"             --title "$SUBJECT"             --notes-file /tmp/release_body.md             --latest             "/tmp/anikuta-release/ani-kuta-v${VERSION}-debug-arm64-v8a.apk"             "/tmp/anikuta-release/SHA256SUMS.txt"
